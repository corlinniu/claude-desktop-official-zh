name: 回归测试

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: 单元测试
        run: python -I -m unittest discover -s tests -v
      - name: 脚本语法
        run: bash -n install-mac.command
